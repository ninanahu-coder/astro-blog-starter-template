<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <rect width="800" height="400" fill="#ffffff"/>
  <text x="16" y="28" font-size="16" font-weight="700" fill="#222939">图 3 · 三分法构图:狗眼放在上三分之一交点,视线方向留白</text>
  <text x="16" y="46" font-size="11" fill="#60739f">Fig 3 · Rule of thirds: eyes on the top-third intersection, space in the gaze direction</text>

  <!-- viewfinder frame 480x270 -->
  <rect x="60" y="70" width="480" height="270" rx="6" fill="#f8f9fc" stroke="#222939" stroke-width="3"/>
  <!-- thirds grid -->
  <line x1="220" y1="70" x2="220" y2="340" stroke="#8fa0c4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="380" y1="70" x2="380" y2="340" stroke="#8fa0c4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="60" y1="160" x2="540" y2="160" stroke="#8fa0c4" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="60" y1="250" x2="540" y2="250" stroke="#8fa0c4" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- sitting dog, facing left, eye at (380,160) -->
  <path d="M 374,186 Q 364,250 372,310 L 448,310 Q 454,238 408,182 Z" fill="#60739f"/>
  <ellipse cx="452" cy="306" rx="15" ry="7" fill="#60739f"/>
  <circle cx="390" cy="172" r="20" fill="#60739f"/>
  <polygon points="394,156 404,132 412,158" fill="#60739f"/>
  <circle cx="372" cy="181" r="7" fill="#8fa0c4"/>
  <circle cx="368" cy="179" r="2.2" fill="#222939"/>
  <circle cx="380" cy="160" r="3.5" fill="#ffffff"/>

  <!-- eye highlight -->
  <circle cx="380" cy="160" r="15" fill="none" stroke="#2337ff" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="396" y1="152" x2="580" y2="120" stroke="#2337ff" stroke-width="1.5"/>
  <text x="586" y="116" font-size="13" font-weight="700" fill="#2337ff">眼睛 ≈ 交点</text>
  <text x="586" y="134" font-size="11" fill="#60739f">对焦点也放这里</text>

  <!-- gaze-direction space -->
  <line x1="300" y1="200" x2="140" y2="200" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="132,200 144,194 144,206" fill="#15803d"/>
  <text x="216" y="222" font-size="13" font-weight="700" fill="#15803d" text-anchor="middle">视线方向留白</text>

  <!-- grid callout -->
  <line x1="220" y1="86" x2="580" y2="70" stroke="#8fa0c4" stroke-width="1.5"/>
  <text x="586" y="66" font-size="13" font-weight="700" fill="#60739f">手机打开"网格线"</text>
  <text x="586" y="84" font-size="11" fill="#60739f">设置 → 相机 → 网格</text>

  <text x="60" y="372" font-size="12" fill="#60739f">要点:狗别放正中间;眼睛落在上三分之一线的交点附近;狗看向哪边,哪边就多留空间。</text>
  <text x="60" y="390" font-size="10" fill="#8fa0c4">Don't centre the dog; place the eyes near a top-third intersection; leave space on the side the dog is looking.</text>
</svg>
